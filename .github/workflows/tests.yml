name: tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: hooks/claude-notify/.build
          key: ${{ runner.os }}-swift-unit-${{ hashFiles('hooks/claude-notify/Package.swift', 'hooks/claude-notify/Sources/**', 'hooks/claude-notify/Tests/**', 'hooks/claude-notify/Makefile', 'hooks/claude-notify/tests/shell/**', 'Makefile', 'hooks/notify.sh', 'hooks/test-claude-notify.sh') }}
          restore-keys: |
            ${{ runner.os }}-swift-unit-
            ${{ runner.os }}-swift-

      - name: Run unit tests (includes docstring gate)
        run: make test-unit

  integration:
    runs-on: macos-latest
    timeout-minutes: 8
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: hooks/claude-notify/.build
          key: ${{ runner.os }}-swift-integration-${{ hashFiles('hooks/claude-notify/Package.swift', 'hooks/claude-notify/Sources/**', 'hooks/claude-notify/Tests/**', 'hooks/claude-notify/Makefile', 'hooks/claude-notify/tests/shell/**', 'Makefile', 'hooks/notify.sh', 'hooks/test-claude-notify.sh') }}
          restore-keys: |
            ${{ runner.os }}-swift-integration-
            ${{ runner.os }}-swift-unit-
            ${{ runner.os }}-swift-

      - name: Run integration tests
        run: make test-integration

  e2e-shell:
    runs-on: macos-latest
    timeout-minutes: 8
    needs: integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: hooks/claude-notify/.build
          key: ${{ runner.os }}-swift-e2e-${{ hashFiles('hooks/claude-notify/Package.swift', 'hooks/claude-notify/Sources/**', 'hooks/claude-notify/Tests/**', 'hooks/claude-notify/Makefile', 'hooks/claude-notify/tests/shell/**', 'Makefile', 'hooks/notify.sh', 'hooks/test-claude-notify.sh') }}
          restore-keys: |
            ${{ runner.os }}-swift-e2e-
            ${{ runner.os }}-swift-integration-
            ${{ runner.os }}-swift-unit-
            ${{ runner.os }}-swift-

      - name: Run shell e2e tests
        run: make test-e2e
